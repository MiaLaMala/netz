<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Netzinfo Vorschau</title>
  <!-- Nur zum Entwickeln, die App lädt diese Datei nicht. Ersetzt Tauri durch erfundene Daten und lädt dann
       die echte Oberfläche aus ui/. Aufruf: vorschau.html#bekannt  oder  #unbekannt,formular  oder
       #netze  #pruefung  #vpn  #fehler, dazu optional ,erklaeren  und  ,vergessen. -->
  <link rel="stylesheet" href="ui/style.css">
  <link rel="stylesheet" href="ui/ansichten/dieses-netz.css">
  <link rel="stylesheet" href="ui/ansichten/gemerkte-netze.css">
  <link rel="stylesheet" href="ui/ansichten/pruefung.css">
  <link rel="stylesheet" href="ui/ansichten/qualitaet.css">
  <link rel="stylesheet" href="ui/ansichten/geraete.css">
  <link rel="stylesheet" href="ui/ansichten/verbindungen.css">
  <link rel="stylesheet" href="ui/ansichten/offen.css">
  <link rel="stylesheet" href="ui/ansichten/live.css">
  <style>
    /* Chrome hat kein Fenstermaterial: die Seitenleiste bekommt hier ersatzweise ihre Farbe. */
    html { background: #e4e4e8; }
    @media (prefers-color-scheme: dark) { html { background: #2c2c2e; } }
  </style>
  <script>
    const marken = location.hash.slice(1).split(',');
    const t = 1793050200; // Mo 26.10.2026, 21:30 UTC
    const fp = (router, domain, subnet) => ({ router, dhcp_server: router, domain, subnet });
    let netze = [
      { name: 'WG', fingerprint: fp('192.0.2.1', 'fritz.box', '192.0.2.0/24'), meins: true, first_seen: t - 86400 * 90, last_seen: t },
      { name: 'Arbeit', fingerprint: fp('203.0.113.1', 'firma.example', '203.0.113.0/24'), meins: false, first_seen: t - 86400 * 40, last_seen: t - 86400 * 3 },
      { name: 'Hotspot', fingerprint: fp('198.51.100.65', null, '198.51.100.64/28'), meins: false, first_seen: t - 86400 * 12, last_seen: t - 86400 * 9 },
    ];
    const subnet = { ip: '192.0.2.20', prefix: 24, mask: '255.255.255.0', network: '192.0.2.0', broadcast: '192.0.2.255', first: '192.0.2.1', last: '192.0.2.254', hosts: 254 };
    const wlan = { interface: 'en0', ip: '192.0.2.20', subnet, router: '192.0.2.1', dhcp_server: '192.0.2.1', dhcp_dns: ['192.0.2.1', '192.0.2.53'], system_dns: ['192.0.2.1', '2001:db8::53'], domain: 'fritz.box' };
    const vpn = { interface: 'utun4', ip: '198.51.100.7', subnet: null, router: '198.51.100.1', dhcp_server: null, dhcp_dns: [], system_dns: ['198.51.100.53'], domain: null };
    const kein = 'Kein Netz gefunden: Es gibt keine Default-Route. Verbinde den Mac mit WLAN oder Kabel und versuche es noch mal.';
    const antworten = {
      dieses_netz: async () => {
        if (marken.includes('fehler')) throw kein;
        if (marken.includes('vpn')) return { info: vpn, netz: null, erkennung_fehler: 'Dieses Netz lässt sich nicht wiedererkennen: Ohne DHCP-Antwort (z. B. bei einem VPN-Tunnel) gibt es keinen Fingerabdruck. Verbinde dich direkt mit dem WLAN oder Kabel und versuche es noch mal.', hinweis: null };
        const bekannt = marken.includes('bekannt');
        return { info: wlan, netz: bekannt ? { ...netze[0], last_seen: t - 3600 * 20 } : null, erkennung_fehler: null, hinweis: null };
      },
      gemerkte_netze: async () => (marken.includes('leerliste') ? [] : netze),
      netz_merken: async ({ name }) => {
        if (name.trim() === '') throw 'Der Name ist leer. Beispiel: `netzinfo merken WG`.';
        if (name.trim() === 'WG') throw 'Der Name „WG“ ist schon für ein anderes Netz vergeben. Nimm einen anderen Namen oder `netzinfo vergessen WG`.';
      },
      netz_vergessen: async ({ name }) => { netze = netze.filter((n) => n.name !== name); },
      dns_verschluesselt: async () => {
        if (marken.includes('dns-fehler')) throw 'Kein Netz gefunden: Es gibt keine Default-Route. Verbinde den Mac mit WLAN oder Kabel und versuche es noch mal.';
        const gesperrt = marken.includes('dns-gesperrt');
        return { netz: 'WG', vorher: null, messung: { dot: gesperrt ? 'Blockiert' : 'Erreichbar', doh: 'Erreichbar', ddr: gesperrt ? null : ['1 dns.example alpn=h2,dot port=853 ipv4hint=192.0.2.53'], zeit: t } };
      },
    };
    window.VORSCHAU = antworten;
    window.__TAURI__ = { core: { invoke: async (befehl, args) => {
      if (!VORSCHAU[befehl]) throw `Die Vorschau kennt den Befehl ${befehl} nicht.`;
      return VORSCHAU[befehl](args);
    } } };

    addEventListener('DOMContentLoaded', () => setTimeout(() => {
      const klick = (s) => document.querySelector(s)?.click();
      if (marken.includes('netze')) klick('#tab-gemerkte-netze');
      if (marken.includes('pruefung')) klick('#tab-pruefung');
      if (marken.includes('geraete')) klick('#tab-geraete');
      setTimeout(() => {
        if (marken.includes('erklaeren')) klick('#erklaeren');
        if (marken.includes('formular')) klick('.aktion button');
        if (marken.includes('formular-fehler')) { klick('.aktion button'); document.querySelector('.formular').requestSubmit(); }
        if (marken.includes('vergessen')) klick('.netz-zeile:nth-child(2) button');
      }, 150);
    }, 100));
  </script>
  <script src="vorschau/dieses-netz.js"></script>
  <script src="vorschau/gemerkte-netze.js"></script>
  <script src="vorschau/pruefung.js"></script>
  <script src="vorschau/qualitaet.js"></script>
  <script src="vorschau/geraete.js"></script>
  <script src="vorschau/verbindungen.js"></script>
  <script src="vorschau/offen.js"></script>
  <script src="vorschau/live.js"></script>
  <script defer src="ui/app.js"></script>
  <script defer src="ui/ansichten/dieses-netz.js"></script>
  <script defer src="ui/ansichten/gemerkte-netze.js"></script>
  <script defer src="ui/ansichten/pruefung.js"></script>
  <script defer src="ui/ansichten/qualitaet.js"></script>
  <script defer src="ui/ansichten/geraete.js"></script>
  <script defer src="ui/ansichten/verbindungen.js"></script>
  <script defer src="ui/ansichten/offen.js"></script>
  <script defer src="ui/ansichten/live.js"></script>
</head>
<body>
  <nav class="seite" aria-label="Bereiche">
    <div class="ziehen"></div>
    <div class="menue" id="menue" role="tablist" aria-orientation="vertical"></div>
  </nav>
  <div class="inhalt">
    <header class="leiste">
      <h1 id="titel"></h1>
      <button class="erklaeren-schalter" id="erklaeren" role="switch" aria-checked="false"><span class="spur"></span><span>Erklären</span></button>
      <button class="knopf" id="aktualisieren">Aktualisieren <span class="kbd" aria-hidden="true">⌘R</span></button>
    </header>
    <main class="scroll" id="scroll" role="tabpanel" tabindex="-1"></main>
  </div>
</body>
</html>
