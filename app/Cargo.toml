[package]
name = "netz-app"
version = "0.1.0"
edition = "2024"
description = "Die Mac-App zu netz."
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
netz = { path = ".." }
serde = { version = "1", features = ["derive"] }
# macos-private-api: needed for the transparent window with the native sidebar material.
tauri = { version = "2.12", features = ["macos-private-api"] }
