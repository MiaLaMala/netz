[package]
name = "netzinfo-app"
version = "0.1.0"
edition = "2024"
description = "Die Mac-App zu Netzinfo."
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
netzinfo = { path = ".." }
# macos-private-api: needed for the transparent window with the native sidebar material.
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-notification = "2.8.0"
