name: Fehler melden
description: Netzinfo tut etwas anderes als erwartet.
labels: [fehler]
body:
  - type: input
    id: os
    attributes:
      label: Betriebssystem und Version
      placeholder: macOS 15.2 oder Debian 12
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Netzinfo-Version
      description: Ausgabe von `netzinfo --version`; bei der App der Eintrag „About Netzinfo“ (oder „Über Netzinfo“) im Menü „Netzinfo“
    validations:
      required: true
  - type: input
    id: befehl
    attributes:
      label: Befehl oder Ansicht
      description: Der Befehl, den du eingegeben hast, oder die Ansicht der App (Übersicht, Tempo, Geräte, Verbindungen)
      placeholder: netzinfo pruefen
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartet
    validations:
      required: true
  - type: textarea
    id: erhalten
    attributes:
      label: Erhalten
    validations:
      required: true
  - type: textarea
    id: ausgabe
    attributes:
      label: Ausgabe ohne echte IPs und WLAN-Namen
      description: |
        Kopier die Ausgabe des Befehls hierher, am besten mit `--erklaer` (Beispiel: `netzinfo pruefen --erklaer`). Bei der App ein Screenshot oder der Text aus der Ansicht.
        Ersetz vorher IP-Adressen, MACs, Hostnamen und WLAN-Namen durch Platzhalter: 192.0.2.1, 198.51.100.7, 203.0.113.9, 2001:db8::1, aa:bb:cc:dd:ee:ff, MeinNetz.
      render: text
  - type: checkboxes
    id: geprueft
    attributes:
      label: Vor dem Absenden
      options:
        - label: Ich habe echte Adressen, MACs und Netznamen in Text und Screenshots ersetzt.
          required: true
