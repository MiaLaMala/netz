name: Fehler melden
description: Netzinfo tut etwas anderes als erwartet.
labels: [fehler]
body:
  - type: input
    id: os
    attributes:
      label: Betriebssystem und Version
      placeholder: macOS 15.2 oder Debian 12
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Netzinfo-Version
      description: Ausgabe von `netzinfo --version`; bei der App die Version aus „Über Netzinfo“
    validations:
      required: true
  - type: input
    id: befehl
    attributes:
      label: Befehl
      placeholder: netzinfo pruefen
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartet
    validations:
      required: true
  - type: textarea
    id: erhalten
    attributes:
      label: Erhalten
    validations:
      required: true
  - type: textarea
    id: ausgabe
    attributes:
      label: Ausgabe ohne echte IPs und WLAN-Namen
      description: Bitte IP-Adressen, MACs, Hostnamen und WLAN-Namen durch Platzhalter ersetzen (z. B. 192.0.2.1).
      render: text
