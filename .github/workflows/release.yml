name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Kommandozeile für Linux, statisch gegen musl gebaut: läuft ohne passende glibc auf jeder Distribution,
  # arm64 auch auf dem Raspberry Pi mit 64-Bit-System. Die App gibt es nur für den Mac.
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, ziel: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, ziel: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.ziel }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - name: Datenbank für Land und Anbieter holen
        run: sh tools/ipdb-bauen.sh ipdb

      - name: CLI bauen
        run: cargo build --release -p netzinfo --target ${{ matrix.ziel }}

      # Ausgaben verworfen, nur der Exit-Code zählt (die Läufe zeigen Netzdaten des Runners).
      - name: Kurztest
        run: |
          b=target/${{ matrix.ziel }}/release/netzinfo
          file "$b" | grep -q static
          "$b" --version
          "$b" subnetz 192.0.2.0/24 > /dev/null
          "$b" hier > /dev/null

      - name: Archiv packen
        run: |
          mkdir out
          tar czf "out/netzinfo-v$(jq -r .version app/tauri.conf.json)-${{ matrix.ziel }}.tar.gz" \
            -C target/${{ matrix.ziel }}/release netzinfo -C "$GITHUB_WORKSPACE" ipdb
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.ziel }}
          path: out/

  mac:
    needs: linux # holt die Linux-Archive, damit SHA256SUMS alle Dateien abdeckt
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v7

      # Version in tauri.conf.json und beiden Cargo.toml muss zusammenpassen, bei Tag-Lauf auch zum Tag.
      - name: Version prüfen
        run: |
          v=$(jq -r .version app/tauri.conf.json)
          for f in Cargo.toml app/Cargo.toml; do
            c=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f" | head -1)
            test "$c" = "$v" || { echo "::error::$f hat Version $c, tauri.conf.json hat $v"; exit 1; }
          done
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Version $v"; exit 1; }
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Tauri-CLI per npx: fertige Binärdatei, kein Kompilieren (cargo install tauri-cli dauert Minuten),
      # und die UI braucht kein npm-Projekt. Node ist auf dem Runner vorinstalliert.
      # Land und Anbieter: Offline-Datenbanken (tools/QUELLEN), kommen ins Bündel (Resources/ipdb) und neben die CLI.
      - name: Datenbank für Land und Anbieter holen
        run: sh tools/ipdb-bauen.sh ipdb

      - name: App bauen (.app, .dmg)
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles app,dmg
        working-directory: app

      - name: CLI bauen
        run: cargo build --release -p netzinfo --target aarch64-apple-darwin

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: out
          merge-multiple: true

      - name: Dateien zusammenstellen
        run: |
          cp target/release/bundle/dmg/*.dmg out/
          tar czf "out/netzinfo-$TAG-aarch64-apple-darwin.tar.gz" -C target/aarch64-apple-darwin/release netzinfo -C "$GITHUB_WORKSPACE" ipdb
          cd out && shasum -a 256 -- * > SHA256SUMS && cat SHA256SUMS

      # Entwurf nur bei einem gepushten Tag. Einen neuen Tag darf GITHUB_TOKEN nicht anlegen: GitHub wertet
      # das als neue Workflow-Dateien und antwortet mit 403. Mia prüft den Entwurf und veröffentlicht von Hand.
      - name: Entwurf-Release anlegen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" out/* --draft --title "Netzinfo $TAG" --generate-notes --verify-tag

      # Probelauf per workflow_dispatch: dieselben Dateien als Artefakt am Lauf, kein Release.
      - name: Artefakt hochladen (Probelauf)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: netzinfo-${{ env.TAG }}-probelauf
          path: out/
