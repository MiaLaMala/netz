[package]
name = "netzinfo"
version = "0.1.0"
edition = "2024"
description = "Kennt jedes Netz, in dem dein Mac war, und meldet, was anders ist."
license = "MIT"
repository = "https://github.com/MiaLaMala/netzinfo"

[workspace]
members = ["app"]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1.0.11", default-features = false }
x509-cert = { version = "0.3.0", default-features = false }
socket2 = { version = "0.6.5", features = ["all"] }
libc = "0.2.191"
maxminddb = { version = "0.32.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-wlan = { version = "=0.3.2", default-features = false, features = ["std", "CWInterface", "CWWiFiClient", "CWChannel", "CWNetwork", "CoreWLANTypes"] }
objc2-core-location = { version = "=0.3.2", default-features = false, features = ["std", "CLLocationManager"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSEnumerator"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
