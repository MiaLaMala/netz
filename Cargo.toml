[package]
name = "netz"
version = "0.1.0"
edition = "2024"
description = "Kennt jedes Netz, in dem dein Mac war, und meldet, was anders ist."

[dependencies]
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1.0.11", default-features = false }
x509-cert = { version = "0.3.0", default-features = false }
